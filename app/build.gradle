plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.l4j21904'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.l4j21904'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // 源码放在 kotlin 目录，需显式声明（设备内与云端 Gradle 构建都依赖此配置）
    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/LICENSE*']
        }
    }
}

dependencies {
    // 界面只用系统框架 View（Activity/TextView/FrameLayout），不需要额外 UI 库
    testImplementation 'junit:junit:4.13.2'
}