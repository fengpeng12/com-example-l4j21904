# 云端构建：哈哈哈 Kotlin 应用的 Debug APK
# 说明：工程没有 gradlew，直接使用 setup-gradle 提供的 gradle 命令
name: Android Build

# 权限给满：避免 workflow 默认只读导致上传产物 / 回写仓库被拒
permissions: write-all

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 查看工程文件
        run: ls -a && echo '---' && ls -a app

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 单元测试
        run: gradle :app:testDebugUnitTest --no-daemon
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore