# 用途：哈哈哈 Kotlin 应用的云端构建（产出 debug APK）
name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 构建 debug APK：有 wrapper 用 wrapper，没有就用 setup-gradle 装的 gradle
      - name: Build debug APK
        run: |
          if [ -x ./gradlew ]; then chmod +x ./gradlew; ./gradlew assembleDebug --no-daemon --stacktrace
          else gradle assembleDebug --no-daemon --stacktrace; fi

      # 测试与 lint 不阻断出包
      - name: Run unit tests
        continue-on-error: true
        run: |
          if [ -x ./gradlew ]; then ./gradlew testDebugUnitTest --no-daemon || true
          else gradle testDebugUnitTest --no-daemon || true; fi

      - name: Lint
        continue-on-error: true
        run: |
          if [ -x ./gradlew ]; then ./gradlew lintDebug --no-daemon || true
          else gradle lintDebug --no-daemon || true; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error